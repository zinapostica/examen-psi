services:
  db:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      MONGODB_URI: mongodb://db:27017/expense_copilot
      STORAGE: local
      LOCAL_UPLOAD_DIR: /data/uploads
      PUBLIC_BASE_URL: http://localhost:8080
      EXTRACTOR: mock
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    depends_on:
      - api

volumes:
  mongodata:
  uploads:
