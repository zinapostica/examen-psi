services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: expense_copilot
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: expense
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expense_copilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://db:5432/expense_copilot
      DATABASE_USERNAME: expense
      DATABASE_PASSWORD: expense
      STORAGE: local
      LOCAL_UPLOAD_DIR: /data/uploads
      PUBLIC_BASE_URL: http://localhost:8080
      EXTRACTOR: mock
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
